<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada | Tienda Online</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #eee;
      font-family: "Segoe UI", Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .caja { max-width: 480px; }
    .codigo {
      font-size: 7rem;
      font-weight: 800;
      color: #c0392b;
      line-height: 1;
    }
    h1 { font-size: 1.6rem; margin: 16px 0 8px; }
    p { color: #aaa; margin-bottom: 28px; }
    a {
      display: inline-block;
      background: #c0392b;
      color: #fff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 6px;
      font-weight: 600;
    }
    a:hover { background: #a93226; }
    .api { display: block; margin-top: 16px; color: #888; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="caja">
    <div class="codigo">404</div>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté roto o que la dirección esté mal escrita.</p>
    <a href="/">Volver al inicio</a>
    <a class="api" href="/api/" style="background:none;">Ver la API</a>
  </div>
</body>
</html>
